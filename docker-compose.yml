services:
  transfer:
    container_name: transfer
    image: ghcr.io/djoko-cli/transfer-majid-film:latest
    restart: unless-stopped

    environment:
      - TRUST_PROXY=true
      - PUID=1026
      - PGID=100
      - DATABASE_URL=file:/db/transfer.db?connection_limit=1

    # Secrets (SMTP/LDAP/S3/OAuth passwords and keys) — deliberately NOT in
    # config.yaml below, which is a plain, live-synced, casually-readable
    # file. `required: false` means a missing file is just "no overrides",
    # same as any single variable left unset inside it — see
    # secrets.env.example at the repo root for the full list and setup:
    #   cp secrets.env.example secrets.env && chmod 600 secrets.env
    # Unlike config.yaml, read once at container start — no live watcher,
    # so a change here needs a restart (`docker compose up -d`) to apply.
    env_file:
      - path: /volume2/docker/transfer/secrets.env
        required: false

    volumes:
      - /volume2/docker/transfer/db:/db
      - /volume1/Transfer:/opt/app/backend/data
      # Mirrors the admin config panel: a change on either side (the file
      # or the panel) is written to the other, live, no restart needed.
      # /opt/app/config.yaml is where CONFIG_FILE resolves to by default
      # (../config.yaml from the backend's own working directory) — the
      # host file must already exist before `docker compose up` (a single-
      # file bind mount over a path that doesn't exist yet gets created as
      # a directory instead), and be writable by PUID:PGID above.
      - /volume2/docker/transfer/config.yaml:/opt/app/config.yaml

    # Transfer's own Caddy listens internally on port 3000 and fronts both
    # the frontend and the backend (splitting /api/* to the backend) — it
    # must stay enabled even behind the NAS's own reverse proxy, which is
    # exactly what TRUST_PROXY=true is for (it tells Caddy to trust the
    # forwarded headers from that proxy instead of replacing internal Caddy).
    ports:
      - "6100:3000"
    network_mode: bridge

    # Scans every uploaded share with ClamAV before it's kept. Needs real
    # resources (see the integrations docs).
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    restart: unless-stopped
    image: clamav/clamav
