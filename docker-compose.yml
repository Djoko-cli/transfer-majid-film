services:
  transfer:
    container_name: transfer
    image: ghcr.io/djoko-cli/transfer-majid-film:latest
    restart: unless-stopped

    environment:
      - TRUST_PROXY=true
      # Dedicated, no-login service identity (synouser --get Transfer),
      # not the operator's own personal DSM account - see the NAS-import
      # mount's own comment below for why this matters specifically for
      # that mount, and docker-compose.yml's git history for how this was
      # arrived at (a real permission investigation, not a default choice).
      - PUID=1031
      # transfer-nas-ro: a group created solely to grant this container
      # read access to the NAS-import mount below - not the default
      # Synology "users" group (100), which every DSM account belongs to.
      # Confirmed live: DSM's own ACL system (however it's configured via
      # the Control Panel) is completely invisible through a Docker bind
      # mount - only classic POSIX owner/group/other bits are ever
      # enforced here, so this group's access is real chgrp -R + chmod
      # g+rX on the host path, not a DSM permission-panel grant.
      - PGID=65539
      - DATABASE_URL=file:/db/transfer.db?connection_limit=1
      # Admin-only "import from NAS" (share.enableNasImport in the admin
      # panel, off by default) — lets a share reference a file already on
      # the NAS via a symlink instead of duplicating it into the volume
      # below. Fixed container-side path; only the host-side mount below
      # decides what it actually points at.
      - NAS_IMPORT_ROOT=/opt/app/backend/nas-import
      # Brand-slide sync (brand.enableSync in the admin panel, off by
      # default) — reads majid.film's own deployed output (brand-manifest
      # .json + assets/img/derived/) to keep the sign-in/upload background
      # slideshow's catalog current automatically. Same fixed-path,
      # host-mount-decides split as NAS_IMPORT_ROOT above.
      - MAJIDFILM_SOURCE_ROOT=/opt/app/backend/majidfilm-source

    volumes:
      # Unlike /opt/app/backend/data below, nothing auto-chowns this one
      # at container start - create-user.sh only ever touches
      # backend/data and frontend/public. Must already be owned by (or at
      # least writable by) PUID:PGID above, same requirement as
      # config.yaml/secrets.env further down - this bit us for real the
      # one time PUID/PGID actually changed (1026:100 → 1031:65539, see
      # their own comment), which is why it's spelled out here now.
      - /volume2/docker/transfer/db:/db
      - /volume1/Transfer:/opt/app/backend/data
      # Mirrors the admin config panel: a change on either side (the file
      # or the panel) is written to the other, live, no restart needed.
      # /opt/app/config.yaml is where CONFIG_FILE resolves to by default
      # (../config.yaml from the backend's own working directory) — the
      # host file must already exist before `docker compose up` (a single-
      # file bind mount over a path that doesn't exist yet gets created as
      # a directory instead), and be writable by PUID:PGID above.
      - /volume2/docker/transfer/config.yaml:/opt/app/config.yaml
      # Secrets (SMTP/LDAP/S3/OAuth passwords and keys) — mirrored live in
      # both directions exactly like config.yaml above, just as its own
      # file (see secrets.env.example at the repo root for the full list)
      # so it can be permissioned tighter, independently of the rest of
      # the config. Same pre-existence and writability requirement as
      # config.yaml above:
      #   cp secrets.env.example secrets.env && chmod 600 secrets.env
      - /volume2/docker/transfer/secrets.env:/opt/app/secrets.env
      # Mounted read-only: the app only ever reads from here (creates
      # symlinks *into* the volume above, never writes here) — :ro makes
      # that true at the filesystem level too, so even a bug in the
      # listing/import code could never touch anything under this path.
      # The path has spaces, so the quoting matters.
      #
      # This folder's real access control turned out to be entirely
      # DSM's own ACL system, which a plain Docker bind mount cannot see
      # at all - confirmed live, the classic POSIX bits every real folder
      # under here showed (d---------, zero for owner/group/other, even
      # though PUID 1026 was that owner at the time) are the *only* thing
      # actually enforced from inside the container; the ACL that grants
      # "Majid" real access through DSM's own services doesn't extend to
      # a raw bind mount's kernel-level view at all, and setfacl (which
      # would have let a single UID be granted without touching anything
      # else) isn't available on this DSM's shell. The fix had to be at
      # the classic Unix layer: a group created solely for this
      # (transfer-nas-ro, see PGID above), then on the host -
      #   chgrp -R transfer-nas-ro "/volume1/Archives Photo et Video"
      #   chmod -R g+rX "/volume1/Archives Photo et Video"
      # - and PUID/PGID above switched to match, rather than broadening
      # this to the default "users" group every DSM account belongs to
      # (this folder is a personal video archive - deliberately not the
      # lightest fix available, isolation was worth the one-time chgrp
      # -R over every file in it).
      - "/volume1/Archives Photo et Video:/opt/app/backend/nas-import:ro"
      # Read-only, same reasoning as the NAS-import mount just above:
      # BrandSyncService only ever reads brand-manifest.json and
      # assets/img/derived/ from here and symlinks *into*
      # BRAND_IMAGE_DIRECTORY (a subdirectory of the Transfer volume
      # above), never writes here — majid.film's own build/deployer.py
      # already treats "nothing ever modifies these files after deploy"
      # as a hard rule (see its README/CHANTIERS.md), :ro just makes the
      # same guarantee true from this side too. "web" is the Synology
      # share name majid.film's own deployer.py rsyncs into (confirmed via
      # its local SMB mount, //<user>@NAS/web); "majidfilm" is the folder
      # under it. On volume2, not volume1 like the two mounts above —
      # confirmed directly on the NAS, no assumed pattern across shares.
      - "/volume2/web/majidfilm:/opt/app/backend/majidfilm-source:ro"

    # Transfer's own Caddy listens internally on port 3000 and fronts both
    # the frontend and the backend (splitting /api/* to the backend) — it
    # must stay enabled even behind the NAS's own reverse proxy, which is
    # exactly what TRUST_PROXY=true is for (it tells Caddy to trust the
    # forwarded headers from that proxy instead of replacing internal Caddy).
    #
    # No network_mode here (used to be `bridge`, Docker's own raw default
    # network) — every other container on this NAS can stay on plain
    # "bridge" without issue, since none of them need to reach a sibling
    # container *by name*; the instant one does (transfer → clamav, right
    # below), it needs a network Compose actually manages, because only
    # those run the embedded DNS server that resolves a service name to
    # that service's container. The plain "bridge" network doesn't do
    # this at all — transfer could never have reached clamav by the
    # CLAMAV_HOST=clamav hostname it defaults to while this stayed set,
    # however long clamav itself took to become ready: a permanent, not
    # transient, "not reachable". `networks:` below opts back in to that
    # DNS with an explicit, chosen name (see the bottom of this file)
    # instead of the auto-generated `<project>_default` Compose would
    # otherwise give it. Host port publishing (ports: below) works
    # exactly the same on any bridge-driver network, named or not, so
    # none of this changes anything about how this container is reached
    # from outside Docker.
    ports:
      - "6100:3000"
    networks:
      - transfer

    # Scans every uploaded share with ClamAV before it's kept. Needs real
    # resources (see the integrations docs).
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    restart: unless-stopped
    image: clamav/clamav
    networks:
      - transfer
    volumes:
      # Without this, every container restart (NAS reboot, Docker daemon
      # restart, an OOM kill, a manual restart — not just a fresh install)
      # throws away the entire signature database and re-downloads it
      # from scratch on next start: several hundred MB, from freshclam's
      # own update mirrors. Until that finishes, clamd isn't listening
      # yet — every scan attempt in that window reports the exact "ClamAV
      # is enabled but not reachable" error this was seeing. The image's
      # own healthcheck (baked into clamav/clamav's Dockerfile, so no
      # explicit `healthcheck:` block is needed here — Compose picks it
      # up from the image) already grants a 6-minute grace period before
      # `depends_on: condition: service_healthy` above gives up waiting,
      # specifically to cover this: a slow connection could still exceed
      # that on a *first* boot, but every boot after this volume exists
      # only needs an incremental signature diff, not a full re-fetch.
      - /volume2/docker/transfer/clamav-db:/var/lib/clamav

# A named, Compose-managed network rather than the default bridge — see
# transfer's own `networks:` comment above for why one is needed at all.
# `name:` pins the exact Docker network name to this instead of Compose's
# own default `<project-directory-name>_default` pattern, so it reads
# the same as every other container's plain "bridge" mode in Container
# Manager's own network list, not like a one-off stack with its own
# generated network. Driver is still bridge underneath — this is a
# *named* bridge network, not a different kind of networking.
networks:
  transfer:
    name: transfer
    driver: bridge
