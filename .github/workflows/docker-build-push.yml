name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease) }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}

      # metadata-action decides what this release is actually named on ghcr,
      # and nothing downstream would notice if it decided wrong — a bad tag set
      # pushes just as successfully as a good one. Printing it makes a
      # regression (an action bump, a trigger change) visible on the run itself
      # instead of surfacing later as an image nobody can find.
      - name: Show the tags this release will push
        run: |
          {
            echo "### Tags"
            echo
            printf '%s\n' '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      # ghcr rejects uppercase and github.repository carries the owner's real
      # casing (Djoko-cli). metadata-action lowercases it for the image tags on
      # its own; the raw cache ref below has to do it itself.
      - name: Lowercase the image name
        id: img
        run: echo "ref=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # This fork only deploys to a single, known amd64 NAS — dropping arm64
      # (and the QEMU emulation it needed) roughly halves build time on its
      # own. GHA layer caching (cache-from/cache-to below) cuts repeat
      # builds further, reusing unchanged layers like `npm ci` when only
      # app code changed, not dependencies.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ref_name is the release tag itself (e.g. v3.0.2) for a
          # `release` trigger, or the branch name (e.g. "main") for a
          # manual workflow_dispatch run — read at runtime by the admin
          # panel's version memo (see APP_VERSION in constants.ts).
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          # The registry, not type=gha. GitHub's cache is isolated by REF, and a
          # release runs on a tag: it can read its own ref's cache (which never
          # exists, no tag is built twice) and the default branch's, never a
          # sibling tag's. Measured on this repo — v3.6.0 reused 0 layers while
          # v3.5.0's 1.6GB sat there unreadable, and the longest build step went
          # from 125s to 291s because of it. Worse, each release wrote its own
          # ~1.6GB that nothing would ever read: 3.5GB of the repo's 10GB budget
          # was already dead weight, evicting the main-branch entries that WOULD
          # have been readable.
          #
          # A scope= would not have fixed this — it changes the key inside a
          # ref's namespace, not which refs may read it. Putting the cache in the
          # registry sidesteps the rule entirely: every build, on any ref, reads
          # and writes the same manifest, and it does not count against the 10GB.
          # It appears as a `buildcache` tag on the package, which is what it is.
          cache-from: type=registry,ref=ghcr.io/${{ steps.img.outputs.ref }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.img.outputs.ref }}:buildcache,mode=max
