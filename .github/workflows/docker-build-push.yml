name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease) }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}

      # metadata-action decides what this release is actually named on ghcr,
      # and nothing downstream would notice if it decided wrong — a bad tag set
      # pushes just as successfully as a good one. Printing it makes a
      # regression (an action bump, a trigger change) visible on the run itself
      # instead of surfacing later as an image nobody can find.
      - name: Show the tags this release will push
        run: |
          {
            echo "### Tags"
            echo
            printf '%s\n' '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # This fork only deploys to a single, known amd64 NAS — dropping arm64
      # (and the QEMU emulation it needed) roughly halves build time on its
      # own. GHA layer caching (cache-from/cache-to below) cuts repeat
      # builds further, reusing unchanged layers like `npm ci` when only
      # app code changed, not dependencies.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ref_name is the release tag itself (e.g. v3.0.2) for a
          # `release` trigger, or the branch name (e.g. "main") for a
          # manual workflow_dispatch run — read at runtime by the admin
          # panel's version memo (see APP_VERSION in constants.ts).
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
