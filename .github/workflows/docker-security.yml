---
name: Docker Security

"on":
  # Not on every push to main — this does a full, no-cache Docker build
  # (no-cache: true below, deliberately, so the Trivy scan sees genuinely
  # current OS package versions rather than stale cached layers) purely to
  # scan it, and that's slow (~5 minutes) for a check nothing else in this
  # repo's workflow actually gates on. Runs instead exactly when
  # docker-build-push.yml's own real, pushed image would (release
  # published), plus a weekly sweep so a newly-disclosed CVE in an
  # unchanged base image still gets caught between releases, and
  # workflow_dispatch for an on-demand check any time.
  release:
    types: [published]
  pull_request:
    branches:
      - main
    # Un build Docker complet sans cache coûte ~5,5 minutes. Le lancer parce
    # qu'une phrase de `docs/` a changé n'apprend rien : l'image produite est
    # identique, et le scan Trivy y verrait exactement les mêmes paquets.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REF: transfer:security-scan

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: ${{ env.IMAGE_REF }}
          no-cache: true

      # SARIF upload to GitHub's Security tab (github/codeql-action/upload-sarif)
      # requires GitHub Advanced Security, which isn't available on a private
      # repo without a paid plan — it failed the whole job on every push here.
      # The table summary below still runs the same scan and prints results
      # straight into the job log, which is all this private fork needs.
      - name: Trivy medium, high, and critical summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret
          vuln-type: os
          ignore-unfixed: true
          exit-code: "0"
