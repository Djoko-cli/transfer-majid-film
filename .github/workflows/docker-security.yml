---
name: Docker Security

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REF: pingvin-share-x:security-scan

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: ${{ env.IMAGE_REF }}
          no-cache: true

      # SARIF upload to GitHub's Security tab (github/codeql-action/upload-sarif)
      # requires GitHub Advanced Security, which isn't available on a private
      # repo without a paid plan — it failed the whole job on every push here.
      # The table summary below still runs the same scan and prints results
      # straight into the job log, which is all this private fork needs.
      - name: Trivy medium, high, and critical summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret
          vuln-type: os
          ignore-unfixed: true
          exit-code: "0"
